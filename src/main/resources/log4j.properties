# log4j 1.x configuration — the platform's audit conscience.
# Do not upgrade unless you are prepared to argue with the council.

log4j.rootLogger=DEBUG, CONSOLE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{ABSOLUTE} %-5p %c{1} - %m%n

# Sacred warnings that may never be silenced.
log4j.logger.com.xcellorate.council=INFO, CONSOLE
